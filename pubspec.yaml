name: poc_ai_quiz
description: A new Flutter project.
publish_to: 'none'

# Should not be edited manually, use `flutter pub run build_runner build` instead.
version: 4.2.0

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  bloc_test: ^10.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  chopper: ^8.7.1
  get_it: ^9.3.0
  flutter_spinkit: ^5.2.0
  isolates: ^3.0.3+8
  drift: ^2.15.0
  sqlite3: ^3.9.0
  path_provider: ^2.0.0
  path: ^1.8.3
  in_app_purchase: ^3.1.13
  flutter_svg: ^2.0.10+1
  go_router: ^18.1.3
  flutter_hooks: ^0.21.3+1
  purchases_flutter: ^10.19.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  flutter_onnxruntime: ^1.8.2
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_auth: ^7.0.1
  firebase_remote_config: ^7.0.1
  url_launcher: ^6.2.4
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  collection: ^1.19.0
  uuid: ^4.5.1
  package_info_plus: ^10.2.2
  solar_icons: ^0.2.0

  quizzy_design:
    path: packages/quizzy_design
  sentry_flutter: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  chopper_generator: ^8.7.1
  json_serializable: ^6.7.1
  drift_dev: ^2.15.0
  mocktail: ^1.0.3
  pigeon: ^29.1.1
  fimber: ^0.7.0

  flutter_lints: ^6.0.0

flutter:
  # Keep CocoaPods for iOS (flavor-specific Podfile setup). Flutter 3.47 enables
  # Swift Package Manager by default.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/model/all_minilm_l6_v2.onnx
    - assets/model/vocab.txt
    - assets/model/tokenizer.json

flutter_gen:
  enabled: true
  output: lib/gen
  localizations:
    enabled: true
    output: lib/gen/l10n